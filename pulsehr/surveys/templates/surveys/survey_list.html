<!DOCTYPE html>
<html>
<head>
    <title>Опросы PulseHR</title>
    <link rel="stylesheet" href="/static/surveys/css/style.css">
</head>
<body>
    <h1>📊 Доступные опросы</h1>
    {% if surveys %}
        {% for survey in surveys %}
        <div class="survey-card">
            <h2>{{ survey.title }}</h2>
            <p>{{ survey.description }}</p>
            <a href="{% url 'survey_detail' survey.id %}" class="btn">Пройти опрос →</a>
        </div>
        {% endfor %}
    {% else %}
        <p>Нет доступных опросов.</p>
    {% endif %}
</body>
</html>
